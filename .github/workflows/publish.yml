# Stáhne specifikace, změněnou commitne, sestaví web a nasadí ho na GitHub Pages.
#
# Stažení i nasazení jsou v jednom workflow: commit vytvořený výchozím
# GITHUB_TOKEN další workflow nespustí, takže by web po změně specifikace
# nikdo nesestavil. Když build spadne, nasazení neproběhne a na Pages zůstane
# poslední funkční verze webu (docs/adr/0001).
#
# Akce jsou připnuté na commit vydané verze; aktualizace je vědomý krok
# stejně jako u závislostí v package.json (docs/adr/0002).

name: Publikace webu

on:
  push:
    branches: [main]
  schedule:
    # Jednou denně v 4:17 UTC; mimo celou hodinu, kdy GitHub plánované běhy zpožďuje.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Běhy jdou po sobě a rozběhnuté nasazení se nepřerušuje.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Specifikace a build
    # Ruční spuštění z jiné větve by specifikaci commitlo do ní, ne do main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit změněné specifikace do main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # Tato část workflow smí zapisovat do repa, cache závislostí proto nepoužívá.
          package-manager-cache: false

      # Bez instalačních skriptů balíčků: build z nich jen kopíruje hotové soubory.
      - name: Instalace závislostí
        run: npm ci --ignore-scripts

      # Výpadek API není chyba: skript vypíše varování, nechá uloženou kopii
      # a web se sestaví z ní.
      - name: Stažení specifikací
        id: fetch
        run: npm run fetch-spec

      # Před buildem, aby byla v repu vidět specifikace, proti které se má
      # případná chyba buildu opravit. Když mezitím do main přibyl jiný commit,
      # push selže a specifikaci uloží až běh spuštěný tím commitem.
      - name: Commit změněných specifikací
        if: steps.fetch.outputs.commit-message != ''
        env:
          COMMIT_MESSAGE: ${{ steps.fetch.outputs.commit-message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec
          git commit --message "$COMMIT_MESSAGE"
          git push

      # Build se zastaví na chybě v textech nebo ve specifikaci a na neveřejném
      # údaji ve výstupu. Důvod je v přehledu běhu jako chyba „Build se zastavil“.
      - name: Build
        run: npm run build

      # Na Pages jde jen výstup buildu.
      - name: Nahrání webu
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Nasazení na Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # nasazení na Pages
      id-token: write # ověření, odkud nasazení pochází
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
