<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{pageTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="{{rootPath}}assets/favicon.svg">
    <link rel="stylesheet" href="{{rootPath}}assets/fonts/fonts.css">
    <link rel="stylesheet" href="{{rootPath}}assets/site.css">
    {{themeStyles}}
  </head>
  <body>
    <header class="site-header" data-scalar-scroll-header>
      <a class="site-logo" href="./" aria-label="eD system"><span class="site-logo-full">{{logo}}</span><span class="site-logo-symbol">{{logoSymbol}}</span></a>
      <!-- Přepínače: na počítači v záhlaví, na mobilu je skript vloží do menu Scalaru. -->
      <div class="site-controls">
        <button class="site-theme" type="button" aria-label="{{themeLabel}}" aria-pressed="false" data-theme-toggle>
          <svg class="site-theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
          <svg class="site-theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        {{languageSwitch}}
        <a class="site-postman" href="{{collection}}" download data-postman-link="{{collection}}" aria-label="{{postmanLabel}}" title="{{postmanLabel}}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span>Postman</span>
        </a>
      </div>
    </header>
    <div id="app"></div>
    <script src="{{rootPath}}assets/scalar/standalone.js"></script>
    <script>
      // Nastavení ověřené na verzi Scalaru 1.78.1. Stránka nesmí volat žádnou
      // cizí doménu (docs/adr/0002) a do úložiště prohlížeče smí zapsat jen
      // barevný režim a jazyk ukázek kódu, na tom stojí, že web nemá vlastní
      // zásady ochrany osobních údajů (docs/adr/0006). Po změně nastavení nebo verze Scalaru obojí ověř znovu.
      Scalar.createApiReference('#app', {
        sources: {{sources}},
        // Jazyk rozhraní; česká verze nese vlastní překlad (i18n/scalar.cs.json),
        // řetězec bez překladu Scalar ukáže anglicky.
        localization: {{localization}},
        // Vzhled určuje site/theme.css; bez něj zůstanou výchozí barvy Scalaru.
        theme: 'none',
        // Písma jsou přibalená (assets/fonts), z CDN Scalaru se nenačítají.
        withDefaultFonts: false,
        // Volání API z prohlížeče bez CORS nefunguje (docs/adr/0003).
        hideTestRequestButton: true,
        // Vede na cizí web client.scalar.com.
        hideClientButton: true,
        // Funkce, které volají servery Scalaru.
        showDeveloperTools: 'never',
        agent: { disabled: true },
        telemetry: false,
        // Záměrně chybí: proxyUrl (proxy by posílala tokeny přes cizí server),
        // mcp a defaultHttpClient (zapsal by do úložiště hned při načtení).
      });

      // Logo vede na úvod právě zvoleného prostředí bez načtení stránky. Úvod
      // (titulek a texty úvodu) má ve Scalaru adresu <prostředí>/description/introduction;
      // prostředí je první část adresy za #. Když úvod nenajde, odkaz načte
      // stránku znovu od začátku.
      document.querySelector('.site-logo').addEventListener('click', (event) => {
        const environment = decodeURIComponent(location.hash.slice(1)).split('/')[0];
        const intro = environment && document.getElementById(`${environment}/description/introduction`);
        if (!intro) return;
        event.preventDefault();
        // Stejná adresa by Scalar neposunula; přes adresu prostředí ji pozná jako změnu.
        if (decodeURIComponent(location.hash.slice(1)) === intro.id) history.replaceState(null, '', `#${environment}`);
        location.hash = intro.id;
      });

      // Přepínač jazyka vede na stejné místo v druhém jazyce a zachová zvolené
      // prostředí: adresy operací, skupin a modelů jsou v obou jazycích stejné.
      // Adresy kapitol úvodu vznikají z nadpisů a mezi jazyky se liší, proto
      // odkaz z úvodu vede na jeho začátek. Adresa se doplní těsně před
      // přechodem, protože Scalar ji při procházení mění bez události.
      // Události se chytají na dokumentu, aby platily i pro kopii v menu.
      const followLanguage = (event) => {
        const link = event.target.closest?.('[data-language-switch]');
        if (!link) return;
        const [environment, section] = location.hash.slice(1).split('/');
        link.setAttribute('href', link.dataset.languageSwitch + (section === 'description' ? `#${environment}/description/introduction` : location.hash));
      };
      for (const type of ['pointerdown', 'focusin', 'click']) document.addEventListener(type, followLanguage, true);

      // Odkaz na kolekci pro Postman stáhne kolekci právě zvoleného prostředí
      // (první část adresy za #). Bez prostředí v adrese zůstane kolekce
      // výchozího prostředí z data-postman-link. Jako u přepínače jazyka se
      // adresa doplní těsně před přechodem a události se chytají na dokumentu,
      // aby platily i pro kopii v menu.
      const COLLECTIONS = {{collections}};
      const followEnvironment = (event) => {
        const link = event.target.closest?.('[data-postman-link]');
        if (!link) return;
        const environment = decodeURIComponent(location.hash.slice(1)).split('/')[0];
        link.setAttribute('href', Object.hasOwn(COLLECTIONS, environment) ? COLLECTIONS[environment] : link.dataset.postmanLink);
      };
      for (const type of ['pointerdown', 'focusin', 'click']) document.addEventListener(type, followEnvironment, true);

      // Tlačítko barevného režimu přepne režim přes skrytý přepínač Scalaru
      // v patičce jeho menu, takže režim dál ukládá jen Scalar (klíč colorMode).
      // Stisknuté tlačítko znamená tmavý režim; ikona se mění podle třídy,
      // kterou Scalar dává na body.
      const SCALAR_THEME_TOGGLE = '.darklight-reference button[aria-pressed]:not([data-theme-toggle])';
      // Během přepnutí jsou ostatní přechody vypnuté (site-theme-switching),
      // aby se barvy stránky změnily najednou.
      document.addEventListener('click', (event) => {
        if (!event.target.closest?.('[data-theme-toggle]')) return;
        document.documentElement.classList.add('site-theme-switching');
        document.querySelector(SCALAR_THEME_TOGGLE)?.click();
        setTimeout(() => document.documentElement.classList.remove('site-theme-switching'), 100);
      });
      // Animace ikon se zapne až po prvním nastavení režimu, aby se ikona
      // nehýbala při načtení stránky.
      const syncThemeButtons = () => {
        const dark = String(document.body.classList.contains('dark-mode'));
        for (const button of document.querySelectorAll('[data-theme-toggle]')) button.setAttribute('aria-pressed', dark);
        if ((document.body.classList.contains('light-mode') || dark === 'true') && !document.documentElement.classList.contains('site-theme-ready')) {
          requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('site-theme-ready')));
          // Vjezdy prvků (site/site.css, vrstva site-motion) až po prvním vykreslení.
          setTimeout(() => document.documentElement.classList.add('site-motion'), 1000);
        }
      };
      new MutationObserver(syncThemeButtons).observe(document.body, { attributes: true, attributeFilter: ['class'] });

      // Na mobilu jsou přepínače v menu: kopie ze záhlaví se vloží do patičky
      // menu Scalaru na řádek s odkazem na Scalar, kde byl jeho přepínač
      // režimu. Scalar menu při otevření vykresluje znovu, proto se kopie
      // vkládá při každé změně stránky. Kterou kopii je vidět, určuje
      // site/site.css podle šířky okna.
      const controls = document.querySelector('.site-header .site-controls');
      const placeControls = () => {
        for (const row of document.querySelectorAll('.darklight-reference :has(> button[aria-pressed]:not([data-theme-toggle]))')) {
          if (row.querySelector('.site-controls')) continue;
          row.append(controls.cloneNode(true));
          syncThemeButtons();
        }
      };
      new MutationObserver(placeControls).observe(document.getElementById('app'), { childList: true, subtree: true });

      // Texty, které má Scalar napevno anglicky (tlačítko kopírování
      // v ukázkách kódu, popisky pro čtečky); volba localization je
      // nepřekládá. Česká verze je přepíše podle i18n/scalar-fixed.cs.json:
      // přesné znění textu v tlačítku nebo v textu pro čtečky a popisku
      // aria-label. {name} v klíči zastupuje proměnnou část. Anglická verze
      // nedostane nic (null). Scalar texty vkládá průběžně, proto se hlídají
      // změny stránky; přeložený text už žádnému klíči neodpovídá.
      const FIXED_TEXTS = {{fixedTexts}};
      if (FIXED_TEXTS) {
        const escape = (text) => text.replace(/[.*+?^$()|[\]\\]/g, '\\$&');
        const rules = Object.entries(FIXED_TEXTS).map(([english, czech]) => ({
          pattern: new RegExp(`^${english.split('{name}').map(escape).join('(.+)')}$`),
          czech,
        }));
        const translate = (text) => {
          const trimmed = text.trim();
          for (const { pattern, czech } of rules) {
            const match = pattern.exec(trimmed);
            if (match) return text.replace(trimmed, czech.replace('{name}', match[1] ?? ''));
          }
          return null;
        };
        const translateLabel = (element) => {
          const label = element.getAttribute('aria-label');
          const translated = label && translate(label);
          if (translated) element.setAttribute('aria-label', translated);
        };
        const translateText = (node) => {
          if (!node.parentElement?.closest('button, .sr-only')) return;
          const translated = translate(node.data);
          if (translated !== null) node.data = translated;
        };
        const translateTree = (node) => {
          if (node.nodeType === Node.TEXT_NODE) return translateText(node);
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          for (const element of [node, ...node.querySelectorAll('[aria-label]')]) if (element.hasAttribute('aria-label')) translateLabel(element);
          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          for (let text = walker.nextNode(); text; text = walker.nextNode()) translateText(text);
        };
        new MutationObserver((records) => {
          for (const record of records) {
            if (record.type === 'childList') record.addedNodes.forEach(translateTree);
            else if (record.type === 'attributes') translateLabel(record.target);
            else translateText(record.target);
          }
        }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['aria-label'] });
        translateTree(document.body);
      }
      syncThemeButtons();
    </script>
  </body>
</html>
